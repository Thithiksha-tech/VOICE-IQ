name: voiceiq
description: "VoiceIQ — AI-Powered Voice Communication Practice & Speech Analysis Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Networking & HTTP
  http: ^1.2.2
  # State & Storage
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  # Audio Recording & Playback on Physical Android & iOS
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  # UI & Presentation
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
