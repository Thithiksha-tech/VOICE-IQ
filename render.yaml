# Render Blueprint: deploys the VoiceIQ FastAPI backend with a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo. You will be asked for GEMINI_API_KEY.
services:
  - type: web
    name: voiceiq-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Password reset emails via Brevo (free): API key + a verified sender address
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: voiceiq-db
          property: connectionString

databases:
  - name: voiceiq-db
    plan: free
    databaseName: voiceiq
    user: voiceiq
