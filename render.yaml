# Render Blueprint: deploys the VoiceIQ FastAPI backend.
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked sync: false are entered
# in the dashboard (Environment tab) and never stored in this public repository.
services:
  - type: web
    name: voiceiq-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # PostgreSQL connection string (Neon free tier: does not expire)
      - key: DATABASE_URL
        sync: false
      # The single administrator, created on first startup
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Password reset / email verification via Brevo (free): API key + a verified sender address
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
